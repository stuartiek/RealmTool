# Discord Integration
discord:
  link_required: false # Set to true to require players to link their Discord account to play.
  link_message: "&cPlease link your Discord account to play!\n&eUse the command: /discord link <YourDiscordUsername>"

# Factions world settings for the phase-one rollout.
# Use /dmt setfactionsspawn while standing in the configured world to set the player entry point.
factions_world:
  visible: false
  name: "world"
  claims_enabled: true
  claims_allowed_worlds: []
  safe_zone_enabled: true
  safe_zone_radius: 96.0
  claims:
    base_limit: 16
    per_playtime_hour: 1

factions_core:
  enabled: true
  min_name_length: 3
  max_name_length: 12
  power:
    max_per_player: 10.0
    death_penalty: 2.0
    regen_per_hour: 1.0
    min_power: 0.0
  raid:
    require_overclaim_for_explosions: true
    alert_cooldown_seconds: 300
    web_push: true
  logs:
    max_entries: 30
  homes:
    allow_teleport: true
    require_safe_claim: true
  discord:
    enabled: false
    webhook_override: ""

# Settings for the Jail feature
settings:
  jail_location: ""

# Database for tickets (Do not edit manually unless you know what you are doing)
tickets:
  next_id: 1

# Database for player notes
notes: {}

# Database for active punishments
punishments: {}

# Database for block logs
logs: {}