api-key: "qs1a_k7OacJtpUAN-9WIJuYVl0DNgght"

web:
  host: "0.0.0.0"
  port: 8091
  public_url: "https://manage.drowsycraft.com"

# Multi-mode network layout for DrowsyCraft.
# Keep Phase 1 full before enabling more modes so the network never feels empty.
